<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>（別紙様式11の2）診療情報提供書 2026年</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background:#f1f5f9; margin:0; }
    @media screen {
      .app-container { display:flex; height:100vh; overflow:hidden; }
      .side-form { width:500px; background:#fff; padding:24px; overflow-y:auto; box-shadow:4px 0 15px rgba(0,0,0,.08); z-index:10; }
      .main-preview { flex-grow:1; padding:20px; background:#e2e8f0; display:flex; justify-content:center; overflow:auto; }
      .page-a4 {
        width:210mm; min-height:297mm; background:#fff; padding:24mm 22mm 14mm 22mm;
        box-shadow:0 10px 30px rgba(0,0,0,.12); box-sizing:border-box; transform-origin: top center;
      }
      @media (max-width:1450px){ .page-a4 { transform:scale(.82); } }
      @media (max-width:1100px){ .page-a4 { transform:scale(.64); } }
      #print-only-container { display:none; }
    }
    @media print {
      @page { size:A4; margin:0; }
      body { background:#fff !important; }
      .app-container, .no-print { display:none !important; }
      #print-only-container { display:block !important; width:210mm !important; background:#fff !important; }
      .print-page {
        width:210mm !important; height:297mm !important; padding:24mm 22mm 14mm 22mm !important;
        box-sizing:border-box !important; background:#fff !important; overflow:hidden !important;
      }
      table, td, th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
    .form-card {
      background:#fff; border-radius:8px; padding:14px; border:1px solid #e2e8f0; margin-bottom:12px;
    }
    .doc-table { width:100%; border-collapse:collapse; border:1.2px solid #222; table-layout:fixed; }
    .doc-table td, .doc-table th {
      border:1px solid #222; padding:4px 6px; vertical-align:top; font-size:.76rem; color:#111; word-wrap:break-word; line-height:1.25;
    }
    .label-cell { background:#fff; font-weight:700; width:88px; }
    .small { font-size:.72rem !important; }
    .uline {
      display:inline-block; border-bottom:1px solid #111; min-height:1.1em; vertical-align:bottom; padding:0 2px 1px 2px;
    }
  </style>
</head>
<body>

<div class="app-container no-print">
  <aside class="side-form">
    <h1 class="text-xl font-bold mb-4 border-b pb-2 text-slate-800">診療情報提供書（別紙様式11の2） 作成</h1>

    <div class="space-y-3">
      <div class="form-card">
        <label class="block text-xs font-bold text-blue-600 mb-2">基本情報・紹介先</label>
        <input type="date" id="date" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="toHospital" placeholder="紹介先医療機関等名" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="toDepartment" placeholder="診療科" class="border p-2 rounded text-sm" oninput="syncUpdate()">
          <input type="text" id="toDoctorName" placeholder="氏名" class="border p-2 rounded text-sm" oninput="syncUpdate()">
        </div>
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="form-card">
        <label class="block text-xs font-bold text-green-600 mb-2">紹介元医療機関</label>
        <input type="text" id="fromAddress" placeholder="所在地" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="fromHospital" placeholder="名称" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="fromPhone" placeholder="電話番号" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="doctorSignature" placeholder="医師署名（又は記名押印）" class="w-full border p-2 rounded text-sm" oninput="syncUpdate()">
        <div class="mt-3 text-xs font-bold text-slate-600">以下の診療報酬項目の届出状況</div>
        <div class="grid grid-cols-1 gap-1 mt-2 text-sm">
          <label><input type="checkbox" id="fee1" oninput="syncUpdate()"> 地域包括診療加算</label>
          <label><input type="checkbox" id="fee2" oninput="syncUpdate()"> 地域包括診療料</label>
          <label><input type="checkbox" id="fee3" oninput="syncUpdate()"> 小児かかりつけ診療料</label>
          <label><input type="checkbox" id="fee4" oninput="syncUpdate()"> 在宅時医学総合管理料</label>
          <label class="ml-5"><input type="checkbox" id="fee4sub" oninput="syncUpdate()"> 在宅療養支援診療所又は在宅療養支援病院</label>
          <label><input type="checkbox" id="fee5" oninput="syncUpdate()"> 施設入居時等医学総合管理料</label>
          <label class="ml-5"><input type="checkbox" id="fee5sub" oninput="syncUpdate()"> 在宅療養支援診療所又は在宅療養支援病院</label>
        </div>
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="form-card">
        <label class="block text-xs font-bold text-slate-500 mb-2">患者情報</label>
        <input type="text" id="patientName" placeholder="患者氏名" class="w-full border p-2 mb-2 rounded text-sm font-bold" oninput="syncUpdate()">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <select id="patientGender" class="border p-2 rounded text-sm" onchange="syncUpdate()">
            <option value=""></option><option value="男">男</option><option value="女">女</option>
          </select>
          <input type="text" id="patientJob" placeholder="職業" class="border p-2 rounded text-sm" oninput="syncUpdate()">
        </div>
        <input type="date" id="patientBirthdayInput" class="w-full border p-2 mb-1 rounded text-sm" oninput="handleBirthday(this.value)">
        <input type="text" id="patientBirthday" placeholder="生年月日" class="w-full border p-2 mb-2 rounded bg-slate-50 text-sm" oninput="syncUpdate()">
        <input type="number" id="patientAge" placeholder="年齢" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="patientAddress" placeholder="患者住所" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="patientPhone" placeholder="電話番号" class="w-full border p-2 rounded text-sm" oninput="syncUpdate()">
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="form-card">
        <label class="block text-xs font-bold text-blue-600 mb-2">診療内容</label>
        <input type="text" id="diseaseName" placeholder="傷病名" class="w-full border p-2 mb-2 rounded text-sm font-bold" oninput="syncUpdate()">
        <input type="text" id="purpose" placeholder="紹介目的" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <textarea id="history" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="既往歴及び家族歴" oninput="syncUpdate()"></textarea>
        <textarea id="progress" class="w-full border p-2 rounded h-24 text-sm mb-2" placeholder="症状経過及び検査結果" oninput="syncUpdate()"></textarea>
        <textarea id="treatment" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="治療経過" oninput="syncUpdate()"></textarea>
        <textarea id="prescription" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="現在の処方" oninput="syncUpdate()"></textarea>
        <textarea id="remarks" class="w-full border p-2 rounded h-16 text-sm" placeholder="備考" oninput="syncUpdate()"></textarea>
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="flex gap-2 pb-2 flex-wrap">
        <button onclick="window.print()" class="flex-grow bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition-all">PDF保存 / 印刷</button>
        <button onclick="saveToBrowser()" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold">保存</button>
        <button onclick="loadFromBrowser(true)" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold">読込</button>
        <button onclick="clearSavedData()" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-600 text-sm font-bold">保存削除</button>
        <button onclick="clearAll()" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-600 text-sm font-bold">全体クリア</button>
      </div>
      <div class="text-xs text-slate-500 mb-8">「保存」でこの端末のブラウザに入力内容を保存できます。</div>
    </div>
  </aside>

  <main class="main-preview">
    <div id="preview-sheet" class="page-a4"></div>
  </main>
</div>

<div id="print-only-container">
  <div id="print-sheet" class="print-page"></div>
</div>

<script>
const STORAGE_KEY = 'referral_112_form_v1';
const FIELDS = [
  'date','toHospital','toDepartment','toDoctorName',
  'fromAddress','fromHospital','fromPhone','doctorSignature',
  'patientName','patientGender','patientBirthday','patientAge','patientAddress','patientPhone','patientJob',
  'diseaseName','purpose','history','progress','treatment','prescription','remarks',
  'fee1','fee2','fee3','fee4','fee4sub','fee5','fee5sub'
];

function esc(v){
  return (v || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}
function getWareki(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return dateStr;
  const year = d.getFullYear();
  const month = d.getMonth() + 1;
  const day = d.getDate();
  let era = "", eraYear = 0;
  if(year >= 2019){ era = "令和"; eraYear = year - 2018; }
  else if(year >= 1989){ era = "平成"; eraYear = year - 1988; }
  else if(year >= 1926){ era = "昭和"; eraYear = year - 1925; }
  else return `${year}年${month}月${day}日`;
  return `${era}${eraYear === 1 ? "元" : eraYear}年${month}月${day}日`;
}
function handleBirthday(val){
  if(!val) return;
  document.getElementById('patientBirthday').value = getWareki(val);
  const birth = new Date(val);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  if(today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
  document.getElementById('patientAge').value = age;
  syncUpdate();
}
function clearSection(btn){
  const card = btn.closest('.form-card');
  card.querySelectorAll('input, textarea, select').forEach(el => {
    if(el.type === 'checkbox') el.checked = false;
    else if(el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  syncUpdate();
}
function getFormData(){
  const data = {};
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if(!el){ data[f] = ''; return; }
    if(el.type === 'checkbox') data[f] = el.checked;
    else data[f] = el.value;
  });
  return data;
}
function applyFormData(data){
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if(!el || typeof data[f] === 'undefined') return;
    if(el.type === 'checkbox') el.checked = !!data[f];
    else el.value = data[f];
  });
  syncUpdate();
}
function saveToBrowser(showMessage = true){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(getFormData()));
  if(showMessage) alert('入力内容をこのブラウザに保存しました。');
}
function loadFromBrowser(showMessage = false){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    if(showMessage) alert('保存データはありません。');
    return false;
  }
  try{
    applyFormData(JSON.parse(raw));
    if(showMessage) alert('保存データを読み込みました。');
    return true;
  }catch(e){
    if(showMessage) alert('保存データを読み込めませんでした。');
    return false;
  }
}
function clearSavedData(){
  if(!confirm('このブラウザに保存した入力内容を削除しますか？')) return;
  localStorage.removeItem(STORAGE_KEY);
  alert('保存データを削除しました。');
}
function clearAll(){
  if(!confirm('すべての入力内容を消去しますか？')) return;
  document.querySelectorAll('input, textarea, select').forEach(el => {
    if(el.id === 'date') return;
    if(el.type === 'checkbox') el.checked = false;
    else if(el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  syncUpdate();
}
function mark(b){ return b ? '☑' : '□'; }

function generateDocumentHTML(data){
  const dateDisplay = data.date ? getWareki(data.date) : '年　月　日';
  return `
    <div style="font-size:11px; text-align:left; margin:0 0 10px 8px;">（別紙様式１１の２）</div>
    <h1 style="text-align:center; font-size:15px; font-weight:700; margin:0 0 16px 0; letter-spacing:.04em;">診療情報提供書</h1>

    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
      <div style="width:46%; font-size:11px; line-height:1.8;">
        <div style="margin-bottom:2px;">紹介先医療機関等名</div>
        <div class="uline" style="width:100%; min-height:15px;">${esc(data.toHospital)}</div>
        <div style="margin-top:6px;">
          <span>担当医</span>
          <span style="margin-left:12px;">診療科</span>
          <span class="uline" style="width:85px; margin:0 6px;">${esc(data.toDepartment)}</span>
          <span>氏名</span>
          <span class="uline" style="width:95px; margin:0 6px;">${esc(data.toDoctorName || '')}</span>
          <span>殿</span>
        </div>
      </div>

      <div style="width:41%; font-size:11px; line-height:1.55;">
        <div style="text-align:right; margin-bottom:6px;">${esc(dateDisplay)}</div>
        <div style="margin-bottom:2px;">紹介元医療機関の所在地及び名称</div>
        <div class="uline" style="width:100%; min-height:15px;">${esc(data.fromAddress)}</div>
        <div class="uline" style="width:100%; min-height:15px;">${esc(data.fromHospital)}</div>
        <div style="margin-top:4px;">電話番号 <span class="uline" style="width:115px; margin-left:6px;">${esc(data.fromPhone)}</span></div>
        <div style="margin-top:6px;">医師署名（又は記名押印）</div>
        <div class="uline" style="width:100%; min-height:15px;">${esc(data.doctorSignature)}</div>
      </div>
    </div>

    <div style="font-size:10px; margin:0 0 8px 0; line-height:1.55;">
      <div style="font-weight:700;">以下の診療報酬項目の届出状況</div>
      <div style="margin-top:2px;">${mark(data.fee1)} 地域包括診療加算　${mark(data.fee2)} 地域包括診療料　${mark(data.fee3)} 小児かかりつけ診療料</div>
      <div>${mark(data.fee4)} 在宅時医学総合管理料　（${mark(data.fee4sub)} 在宅療養支援診療所又は在宅療養支援病院）</div>
      <div>${mark(data.fee5)} 施設入居時等時医学総合管理料　（${mark(data.fee5sub)} 在宅療養支援診療所又は在宅療養支援病院）</div>
    </div>

    <table class="doc-table" style="margin-bottom:8px;">
      <tr>
        <td class="label-cell" style="width:16%;">患者氏名</td>
        <td style="width:38%;">${esc(data.patientName)}</td>
        <td class="label-cell" style="width:12%;">性別</td>
        <td style="width:10%; text-align:center;">${esc(data.patientGender)}</td>
        <td class="label-cell" style="width:10%;">男・女</td>
        <td style="width:14%;"></td>
      </tr>
      <tr>
        <td class="label-cell">患者住所</td>
        <td colspan="5">${esc(data.patientAddress)}</td>
      </tr>
      <tr>
        <td class="label-cell">電話番号</td>
        <td colspan="3">${esc(data.patientPhone)}</td>
        <td class="label-cell">職業</td>
        <td>${esc(data.patientJob)}</td>
      </tr>
      <tr>
        <td class="label-cell">生年月日</td>
        <td colspan="5">${esc(data.patientBirthday)}（${esc(data.patientAge)} 歳）</td>
      </tr>
      <tr>
        <td class="label-cell">傷病名</td>
        <td colspan="5" style="height:26px; font-weight:700;">${esc(data.diseaseName)}</td>
      </tr>
    </table>

    <table class="doc-table">
      <tr><td class="label-cell" style="height:36px;">紹介目的</td><td>${esc(data.purpose)}</td></tr>
      <tr><td class="label-cell" style="height:58px;">既往歴及び家族歴</td><td>${esc(data.history)}</td></tr>
      <tr><td class="label-cell" style="height:108px;">症状経過及び検査結果</td><td>${esc(data.progress)}</td></tr>
      <tr><td class="label-cell" style="height:58px;">治療経過</td><td>${esc(data.treatment)}</td></tr>
      <tr><td class="label-cell" style="height:52px;">現在の処方</td><td>${esc(data.prescription)}</td></tr>
      <tr><td class="label-cell" style="height:42px;">備考</td><td>${esc(data.remarks)}</td></tr>
    </table>

    <div style="font-size:8.6px; line-height:1.45; margin-top:8px;">
      <div style="font-weight:700;">記載上の注意</div>
      <div>1．必要がある場合は続紙に記載して添付すること。</div>
      <div>2．必要がある場合は画像診断のフィルム、検査の記録を添付すること。</div>
      <div>3．紹介先が保険医療機関以外である場合は、紹介先医療機関等名の欄に紹介先保険薬局、市町村、保健所名等を記入すること。かつ、患者住所及び電話番号を必ず記入すること。</div>
      <div>4．2回目以降や直接手渡すなど作成した医療機関から送付されたものであることが明らかな場合は、医師の氏名については記名のみとし、署名又は押印を省略しても差し支えない。</div>
    </div>
  `;
}

function syncUpdate(){
  const data = getFormData();
  const html = generateDocumentHTML(data);
  document.getElementById('preview-sheet').innerHTML = html;
  document.getElementById('print-sheet').innerHTML = html;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    const el = document.activeElement;
    if(!el) return;
    if(el.tagName === 'TEXTAREA') return;
    e.preventDefault();
    const focusables = Array.from(document.querySelectorAll('input, select, textarea, button'))
      .filter(el => !el.disabled && el.offsetParent !== null && el.type !== 'hidden');
    const idx = focusables.indexOf(el);
    if(idx > -1 && idx < focusables.length - 1) focusables[idx + 1].focus();
  }
});
window.onload = () => {
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      applyFormData(JSON.parse(raw));
      if(!document.getElementById('date').value) document.getElementById('date').value = new Date().toISOString().split('T')[0];
      syncUpdate();
      return;
    }catch(e){}
  }
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  syncUpdate();
};
</script>
</body>
</html>
