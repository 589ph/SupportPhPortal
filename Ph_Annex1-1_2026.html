<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>患者の服薬状況等に係る情報提供書（別紙様式1-1）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background:#f1f5f9; margin:0; }
    @media screen {
      .app-container { display:flex; min-height:100vh; overflow:hidden; }
      .side-form { width:520px; background:#fff; padding:24px; overflow-y:auto; box-shadow:4px 0 15px rgba(0,0,0,.08); z-index:10; }
      .main-preview { flex-grow:1; padding:20px; background:#e2e8f0; display:flex; justify-content:center; overflow:auto; }
      .preview-wrap { width:210mm; transform-origin:top center; }
      .page-a4 {
        width:210mm;
        min-height:297mm;
        background:#fff;
        padding:18mm 18mm 12mm 18mm;
        box-sizing:border-box;
        box-shadow:0 10px 30px rgba(0,0,0,.12);
        margin-bottom:20px;
      }
      @media (max-width:1450px){ .preview-wrap { transform:scale(.82); } }
      @media (max-width:1100px){ .preview-wrap { transform:scale(.64); } }
      #print-only-container { display:none; }
    }
    @media print {
      @page { size:A4; margin:0; }
      body { background:#fff !important; }
      .app-container, .no-print { display:none !important; }
      #print-only-container { display:block !important; width:210mm !important; background:#fff !important; }
      .page-a4 {
        width:210mm !important;
        min-height:297mm !important;
        height:297mm !important;
        padding:18mm 18mm 12mm 18mm !important;
        box-sizing:border-box !important;
        box-shadow:none !important;
        margin:0 !important;
        overflow:hidden !important;
        page-break-after:always;
      }
      table, td, th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
    .form-card {
      background:#fff; border-radius:8px; padding:14px; border:1px solid #e2e8f0; margin-bottom:12px;
    }
    .doc-table {
      width:100%; border-collapse:collapse; border:1.2px solid #111; table-layout:fixed;
    }
    .doc-table td, .doc-table th {
      border:1px solid #111; padding:4px 6px; vertical-align:top; font-size:11px; color:#111; word-wrap:break-word; line-height:1.28;
    }
    .label-cell {
      background:#fff; font-weight:700; width:94px;
    }
    .uline {
      display:inline-block; border-bottom:1px solid #111; min-height:1.1em; vertical-align:bottom; padding:0 2px 1px 2px;
    }
    .small { font-size:10px; }
    .tiny { font-size:8.8px; }
  </style>
</head>
<body>

<div class="app-container no-print">
  <aside class="side-form">
    <h1 class="text-xl font-bold mb-4 border-b pb-2 text-slate-800">患者の服薬状況等に係る情報提供書（別紙様式1-1） 作成</h1>

    <div class="space-y-3">
      <div class="form-card">
        <label class="block text-xs font-bold text-blue-600 mb-2">基本情報・情報提供先</label>
        <input type="date" id="date" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="toHospital" placeholder="情報提供先保険医療機関名" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="toDepartment" placeholder="診療科" class="border p-2 rounded text-sm" oninput="syncUpdate()">
          <input type="text" id="toDoctorName" placeholder="氏名" class="border p-2 rounded text-sm" oninput="syncUpdate()">
        </div>
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="form-card">
        <label class="block text-xs font-bold text-green-600 mb-2">情報提供元（保険薬局）</label>
        <input type="text" id="fromAddress" placeholder="所在地" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="fromPharmacy" placeholder="名称" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="fromPhone" placeholder="電話" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="fromFax" placeholder="FAX" class="w-full border p-2 mb-1 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="pharmacistName" placeholder="保険薬剤師氏名" class="w-full border p-2 rounded text-sm" oninput="syncUpdate()">
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="form-card">
        <label class="block text-xs font-bold text-slate-500 mb-2">患者情報</label>
        <input type="text" id="patientName" placeholder="患者氏名" class="w-full border p-2 mb-2 rounded text-sm font-bold" oninput="syncUpdate()">
        <div class="grid grid-cols-2 gap-2 mb-2">
          <select id="patientGender" class="border p-2 rounded text-sm" onchange="syncUpdate()">
            <option value=""></option>
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
          <input type="number" id="patientAge" placeholder="年齢" class="border p-2 rounded text-sm" oninput="syncUpdate()">
        </div>
        <input type="date" id="patientBirthdayInput" class="w-full border p-2 mb-1 rounded text-sm" oninput="handleBirthday(this.value)">
        <input type="text" id="patientBirthday" placeholder="生年月日" class="w-full border p-2 mb-2 rounded bg-slate-50 text-sm" oninput="syncUpdate()">
        <input type="text" id="patientAddress" placeholder="住所" class="w-full border p-2 mb-2 rounded text-sm" oninput="syncUpdate()">
        <input type="text" id="patientPhone" placeholder="電話番号" class="w-full border p-2 rounded text-sm" oninput="syncUpdate()">
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="form-card">
        <label class="block text-xs font-bold text-blue-600 mb-2">情報提供内容</label>
        <textarea id="summary" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="情報提供の概要" oninput="syncUpdate()"></textarea>
        <textarea id="prescriptionInfo" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="1 処方薬の情報 / 薬剤名等" oninput="syncUpdate()"></textarea>
        <textarea id="combinedMeds" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="2 併用薬剤等の情報 / 薬剤名等" oninput="syncUpdate()"></textarea>
        <textarea id="adherenceInfo" class="w-full border p-2 rounded h-20 text-sm mb-2" placeholder="3 処方薬剤の服用状況（アドヒアランス及び残薬等）及びそれに対する指導に関する情報" oninput="syncUpdate()"></textarea>
        <textarea id="patientFamilyInfo" class="w-full border p-2 rounded h-20 text-sm mb-2" placeholder="4 患者、家族又は介護者からの情報" oninput="syncUpdate()"></textarea>
        <textarea id="proposal" class="w-full border p-2 rounded h-16 text-sm mb-2" placeholder="5 薬剤に関する提案" oninput="syncUpdate()"></textarea>
        <textarea id="otherInfo" class="w-full border p-2 rounded h-16 text-sm" placeholder="6 その他" oninput="syncUpdate()"></textarea>
        <div style="text-align:right; margin-top:6px;"><button type="button" onclick="clearSection(this)" style="font-size:11px; color:#64748b;">クリア</button></div>
      </div>

      <div class="flex gap-2 pb-2 flex-wrap">
        <button onclick="window.print()" class="flex-grow bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition-all">PDF保存 / 印刷</button>
        <button onclick="saveToBrowser()" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold">保存</button>
        <button onclick="loadFromBrowser(true)" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-700 text-sm font-bold">読込</button>
        <button onclick="clearSavedData()" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-600 text-sm font-bold">保存削除</button>
        <button onclick="clearAll()" class="px-4 py-4 border rounded-xl bg-white hover:bg-slate-50 text-slate-600 text-sm font-bold">全体クリア</button>
      </div>
      <div class="text-xs text-slate-500 mb-8">「保存」でこの端末のブラウザに入力内容を保存できます。情報提供元保険薬局の保存にも使えます。</div>
    </div>
  </aside>

  <main class="main-preview">
    <div id="preview-sheet" class="preview-wrap"></div>
  </main>
</div>

<div id="print-only-container">
  <div id="print-sheet"></div>
</div>

<script>
const STORAGE_KEY = 'yakuzai_info_11_1_full_v1';
const FIELDS = [
  'date','toHospital','toDepartment','toDoctorName',
  'fromAddress','fromPharmacy','fromPhone','fromFax','pharmacistName',
  'patientName','patientGender','patientAge','patientBirthday','patientAddress','patientPhone',
  'summary','prescriptionInfo','combinedMeds','adherenceInfo','patientFamilyInfo','proposal','otherInfo'
];

function esc(v){
  return (v || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}
function getWareki(dateStr){
  if(!dateStr) return "";
  const d = new Date(dateStr);
  if(isNaN(d.getTime())) return dateStr;
  const year = d.getFullYear();
  const month = d.getMonth() + 1;
  const day = d.getDate();
  let era = "", eraYear = 0;
  if(year >= 2019){ era = "令和"; eraYear = year - 2018; }
  else if(year >= 1989){ era = "平成"; eraYear = year - 1988; }
  else if(year >= 1926){ era = "昭和"; eraYear = year - 1925; }
  else return `${year}年${month}月${day}日`;
  return `${era}${eraYear === 1 ? "元" : eraYear}年${month}月${day}日`;
}
function handleBirthday(val){
  if(!val) return;
  document.getElementById('patientBirthday').value = getWareki(val);
  const birth = new Date(val);
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  if(today.getMonth() < birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() < birth.getDate())) age--;
  document.getElementById('patientAge').value = age;
  syncUpdate();
}
function clearSection(btn){
  const card = btn.closest('.form-card');
  card.querySelectorAll('input, textarea, select').forEach(el => {
    if(el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  syncUpdate();
}
function getFormData(){
  const data = {};
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    data[f] = el ? el.value : '';
  });
  return data;
}
function applyFormData(data){
  FIELDS.forEach(f => {
    const el = document.getElementById(f);
    if(!el || typeof data[f] === 'undefined') return;
    el.value = data[f];
  });
  syncUpdate();
}
function saveToBrowser(showMessage = true){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(getFormData()));
  if(showMessage) alert('入力内容をこのブラウザに保存しました。');
}
function loadFromBrowser(showMessage = false){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    if(showMessage) alert('保存データはありません。');
    return false;
  }
  try{
    applyFormData(JSON.parse(raw));
    if(showMessage) alert('保存データを読み込みました。');
    return true;
  }catch(e){
    if(showMessage) alert('保存データを読み込めませんでした。');
    return false;
  }
}
function clearSavedData(){
  if(!confirm('このブラウザに保存した入力内容を削除しますか？')) return;
  localStorage.removeItem(STORAGE_KEY);
  alert('保存データを削除しました。');
}
function clearAll(){
  if(!confirm('すべての入力内容を消去しますか？')) return;
  document.querySelectorAll('input, textarea, select').forEach(el => {
    if(el.id === 'date') return;
    if(el.tagName === 'SELECT') el.selectedIndex = 0;
    else el.value = '';
  });
  syncUpdate();
}

function generateDocumentHTML(data){
  const dateDisplay = data.date ? getWareki(data.date) : '令和　年　月　日';
  return `
    <div class="page-a4">
      <div style="font-size:11px; margin:0 0 8px 6px;">（別紙様式１－１）</div>
      <h1 style="text-align:center; font-size:21px; font-weight:700; margin:0 0 12px 0;">患者の服薬状況等に係る情報提供書</h1>

      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px;">
        <div style="width:44%; font-size:12px; line-height:1.75;">
          <div style="margin-bottom:2px;">情報提供先保険医療機関名</div>
          <div class="uline" style="width:100%; min-height:16px;">${esc(data.toHospital)}</div>
          <div style="margin-top:6px;">
            <span>担当医</span>
            <span style="margin-left:10px;">診療科</span>
            <span class="uline" style="width:84px; margin:0 6px;">${esc(data.toDepartment)}</span>
            <span>氏名</span>
            <span class="uline" style="width:90px; margin:0 6px;">${esc(data.toDoctorName || '')}</span>
            <span>殿</span>
          </div>
        </div>

        <div style="width:42%; font-size:12px; line-height:1.55;">
          <div style="text-align:right; margin-bottom:4px;">${esc(dateDisplay)}</div>
          <div style="margin-bottom:2px;">情報提供元保険薬局の所在地及び名称</div>
          <div class="uline" style="width:100%; min-height:15px;">${esc(data.fromAddress)}</div>
          <div class="uline" style="width:100%; min-height:15px;">${esc(data.fromPharmacy)}</div>
          <div>電　話 <span class="uline" style="width:115px; margin-left:6px;">${esc(data.fromPhone)}</span></div>
          <div>（ＦＡＸ）<span class="uline" style="width:115px; margin-left:6px;">${esc(data.fromFax)}</span></div>
          <div>保険薬剤師氏名 <span class="uline" style="width:115px; margin-left:6px;">${esc(data.pharmacistName)}</span><span style="float:right;">印</span></div>
        </div>
      </div>

      <table class="doc-table" style="margin-bottom:8px;">
        <tr>
          <td class="label-cell" style="width:16%;">患者氏名</td>
          <td colspan="3">${esc(data.patientName)}</td>
        </tr>
        <tr>
          <td class="label-cell">性別（男・女）</td>
          <td style="width:18%;">${esc(data.patientGender)}</td>
          <td class="label-cell" style="width:22%;">生年月日</td>
          <td>${esc(data.patientBirthday)} <span class="small">（${esc(data.patientAge)} 歳）</span></td>
        </tr>
        <tr>
          <td class="label-cell">住所</td>
          <td colspan="3">${esc(data.patientAddress)}</td>
        </tr>
        <tr>
          <td class="label-cell">電話番号</td>
          <td colspan="3">${esc(data.patientPhone)}</td>
        </tr>
      </table>

      <div style="font-size:12px; font-weight:700; margin:4px 0 5px 0;">以下のとおり、情報提供いたします。</div>

      <table class="doc-table" style="margin-bottom:8px;">
        <tr>
          <td style="height:44px;">
            <div style="font-weight:700;">情報提供の概要：</div>
            <div style="margin-top:4px;">${esc(data.summary)}</div>
          </td>
        </tr>
      </table>

      <table class="doc-table">
        <tr>
          <td class="label-cell" style="height:52px;">１ 処方薬の情報</td>
          <td><div style="font-weight:700;">薬剤名等：</div><div style="margin-top:4px;">${esc(data.prescriptionInfo)}</div></td>
        </tr>
        <tr>
          <td class="label-cell" style="height:56px;">２ 併用薬剤等の情報</td>
          <td><div style="font-weight:700;">薬剤名等：</div><div style="margin-top:4px;">${esc(data.combinedMeds)}</div></td>
        </tr>
        <tr>
          <td class="label-cell" style="height:78px;">３ 処方薬剤の服用状況</td>
          <td>${esc(data.adherenceInfo)}</td>
        </tr>
        <tr>
          <td class="label-cell" style="height:78px;">４ 患者、家族又は介護者からの情報</td>
          <td>${esc(data.patientFamilyInfo)}</td>
        </tr>
        <tr>
          <td class="label-cell" style="height:54px;">５ 薬剤に関する提案</td>
          <td>${esc(data.proposal)}</td>
        </tr>
        <tr>
          <td class="label-cell" style="height:54px;">６ その他</td>
          <td>${esc(data.otherInfo)}</td>
        </tr>
      </table>

      <div style="font-size:9px; line-height:1.55; margin-top:10px;">
        <div style="font-weight:700;">［記載上の注意］</div>
        <div>１ 必要がある場合には、続紙に記載して添付すること。</div>
        <div>２ わかりやすく記入すること。</div>
        <div>３ 必要な場合には、手帳又は処方箋等の写しを添付すること。</div>
      </div>
    </div>
  `;
}

function syncUpdate(){
  const data = getFormData();
  const html = generateDocumentHTML(data);
  document.getElementById('preview-sheet').innerHTML = html;
  document.getElementById('print-sheet').innerHTML = html;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){
    const el = document.activeElement;
    if(!el) return;
    if(el.tagName === 'TEXTAREA') return;
    e.preventDefault();
    const focusables = Array.from(document.querySelectorAll('input, select, textarea, button'))
      .filter(el => !el.disabled && el.offsetParent !== null && el.type !== 'hidden');
    const idx = focusables.indexOf(el);
    if(idx > -1 && idx < focusables.length - 1) focusables[idx + 1].focus();
  }
});

window.onload = () => {
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      applyFormData(JSON.parse(raw));
      if(!document.getElementById('date').value) document.getElementById('date').value = new Date().toISOString().split('T')[0];
      syncUpdate();
      return;
    }catch(e){}
  }
  document.getElementById('date').value = new Date().toISOString().split('T')[0];
  syncUpdate();
};
</script>
</body>
</html>
